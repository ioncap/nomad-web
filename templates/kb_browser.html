<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N.O.M.A.D — Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root,.dark{
  --bg:#1a1a1e;--bg2:#222226;--bg3:#2a2a2f;
  --border:#363640;--border2:#2e2e38;
  --t1:#e8e6e3;--t2:#9d9b97;--t3:#6b6966;
  --accent:#c49a6c;--accent2:#8b7355;--accentg:rgba(196,154,108,0.08);
  --ok:#7d9e7a;--err:#c47070;--warn:#c4a86c;
  --r:12px;--rs:8px;--tr:0.2s cubic-bezier(0.4,0,0.2,1);
}
.light{--bg:#f5f5f5;--bg2:#fff;--bg3:#eee;--border:#ddd;--border2:#ccc;--t1:#1a1a1e;--t2:#555;--t3:#888;--accent:#8b5e3c;--ok:#5a8f5a;--err:#c04040;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.7}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:inherit;text-decoration:none}

/* Layout */
.page{max-width:960px;margin:0 auto;padding:0 24px 60px}
header{padding:24px 0 16px;border-bottom:1px solid var(--border2);margin-bottom:32px}
.header-row{display:flex;align-items:baseline;justify-content:space-between}
.logo{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.18em;color:var(--t2)}
.logo span{color:var(--accent)}
.nav{display:flex;gap:4px}
.nav-btn{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);background:none;border:1px solid var(--border);padding:4px 12px;border-radius:20px;cursor:pointer;transition:all var(--tr);letter-spacing:.05em;text-decoration:none}
.nav-btn:hover{color:var(--t2);border-color:var(--t3)}

/* Section */
.section{margin-bottom:32px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-title{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--t3);text-transform:uppercase}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* Buttons */
.btn{font-family:'DM Mono',monospace;font-size:10px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all var(--tr)}
.btn:hover{border-color:var(--t3);color:var(--t1)}
.btn-danger{color:var(--err);border-color:rgba(196,112,112,0.4)}
.btn-danger:hover{background:rgba(196,112,112,0.08);border-color:var(--err)}
.btn-ok{color:var(--ok);border-color:rgba(125,158,122,0.4)}
.btn-ok:hover{background:rgba(125,158,122,0.08);border-color:var(--ok)}

/* Stats */
#kb-stats{display:flex;gap:12px;flex-wrap:wrap}
.kb-stat{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rs);padding:10px 16px;min-width:120px}
.kb-stat-label{display:block;font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.kb-stat-val{font-family:'DM Mono',monospace;font-size:14px;color:var(--t1)}

/* Search */
.search-wrap{flex:1;min-width:180px;max-width:360px}
#kb-search{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-family:'DM Mono',monospace;font-size:12px;color:var(--t1);outline:none;transition:border-color var(--tr)}
#kb-search::placeholder{color:var(--t3)}
#kb-search:focus{border-color:var(--accent)}

/* Doc list */
.kb-doc-row{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px 18px;margin-bottom:8px;transition:border-color var(--tr)}
.kb-doc-row:hover{border-color:var(--border)}
.kb-doc-title{font-size:15px;color:var(--t1);margin-bottom:4px;font-weight:400}
.kb-doc-meta{display:flex;gap:10px;margin-bottom:6px}
.kb-doc-src,.kb-doc-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3)}
.kb-doc-preview{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:8px}
.kb-doc-actions{display:flex;gap:6px}
.kb-btn{font-family:'DM Mono',monospace;font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;transition:all var(--tr)}
.kb-btn:hover{color:var(--t2);border-color:var(--t3)}
.kb-btn-del{color:var(--err);border-color:rgba(196,112,112,0.3)}
.kb-btn-del:hover{background:rgba(196,112,112,0.08);border-color:var(--err)}
.kb-btn-view:hover{color:var(--accent);border-color:var(--accent)}

/* Pager */
#kb-pager{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:'DM Mono',monospace;font-size:10px;color:var(--t3)}
.kb-pager-btn{font-family:'DM Mono',monospace;font-size:10px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all var(--tr)}
.kb-pager-btn:hover{border-color:var(--t3)}
.kb-pager-info{flex:1;text-align:center}

/* States */
.kb-loading{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3);padding:20px 0}
.kb-err{font-family:'DM Mono',monospace;font-size:11px;color:var(--err);padding:8px 0}
.kb-empty{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3);padding:20px 0;text-align:center}

/* Modal */
#kb-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:20px}
.kb-modal-inner{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:680px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.kb-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border2);flex-shrink:0}
.kb-modal-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.kb-modal-close-btn{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;transition:color var(--tr)}
.kb-modal-close-btn:hover{color:var(--t1)}
#kb-modal-body{overflow-y:auto;padding:20px}
.kb-modal-title{font-size:18px;margin-bottom:8px;color:var(--t1)}
.kb-modal-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap}
.kb-modal-content{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--t2);white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border2);border-radius:var(--rs);padding:14px}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-row">
      <div class="logo">N.O.M.A.D<span>.</span></div>
      <nav class="nav">
        <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">&#127769; dark</button>
        <a class="nav-btn" href="/">chat</a>
        <a class="nav-btn" href="/voice">voice</a>
      </nav>
    </div>
  </header>

  <div class="section">
    <div class="section-head">
      <span class="section-title">Collection stats</span>
      <div class="actions">
        <button class="btn btn-ok" id="kb-export-btn">&#8595; export</button>
        <button class="btn btn-danger" id="kb-purge-btn">&#128465; purge</button>
      </div>
    </div>
    <div id="kb-stats"><span class="kb-loading">Loading stats…</span></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-title">Documents</span>
      <div class="search-wrap">
        <input id="kb-search" type="search" placeholder="Search title or content…" autocomplete="off">
      </div>
    </div>
    <div id="kb-doc-list"><div class="kb-loading">Loading…</div></div>
    <div id="kb-pager"></div>
  </div>
</div>

<!-- Document detail modal -->
<div id="kb-modal">
  <div class="kb-modal-inner">
    <div class="kb-modal-head">
      <span class="kb-modal-label">Document</span>
      <button class="kb-modal-close-btn" id="kb-modal-close">&#10005;</button>
    </div>
    <div id="kb-modal-body"></div>
  </div>
</div>

<script>
function toggleTheme(){
  var h=document.documentElement;
  var isDark=h.classList.contains('dark');
  h.classList.toggle('dark',!isDark);
  h.classList.toggle('light',isDark);
  document.getElementById('themeBtn').textContent=isDark?'☀️ light':'🌙 dark';
}
</script>
<script src="/static/js/kb-browser.js"></script>
</body>
</html>
